<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Weekly Lesson Scheduler</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}h1{font-size:26px;margin:0 0 6px}h2{font-size:16px;margin:0 0 12px}.muted{color:#6b7280}.small{font-size:13px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.03)}
.role-switch{display:flex;border:1px solid #d1d5db;border-radius:12px;overflow:hidden}.role{border:0;background:#fff;padding:10px 14px;cursor:pointer}.role.active{background:#111827;color:#fff}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}.p1dot{background:#b7efc5}.p2dot{background:#ffe59a}.matchdot{background:#bcdcff}.confirmeddot{background:#d8c2ff}.summary{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.table-wrap{overflow:auto;max-height:72vh}.schedule-card{padding:0;overflow:hidden}table{border-collapse:separate;border-spacing:0;width:100%;min-width:930px}th,td{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;text-align:center;height:34px;font-size:12px;min-width:108px}th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#fff;min-width:72px}thead th{position:sticky;top:0;background:#f9fafb;z-index:3;padding:9px 4px}thead th:first-child{z-index:4}.slot{cursor:pointer;user-select:none;transition:.08s}.slot:hover{outline:2px solid #c7d2fe;outline-offset:-2px}.slot.p1{background:#b7efc5}.slot.p2{background:#ffe59a}.slot.other-p1{box-shadow:inset 0 -5px 0 #7dd3fc}.slot.other-p2{box-shadow:inset 0 -5px 0 #fde68a}.slot.match90{outline:2px solid #60a5fa;outline-offset:-2px}.slot.confirmed{background:#d8c2ff!important;outline:2px solid #8b5cf6;outline-offset:-2px}.match-list{display:flex;flex-wrap:wrap;gap:8px}.match-btn{border:1px solid #bfdbfe;background:#eff6ff;border-radius:999px;padding:8px 11px;cursor:pointer}.match-btn.confirmed{border-color:#8b5cf6;background:#ede9fe}.sync-ok{color:#047857}.sync-local{color:#92400e}.sync-error{color:#b91c1c}.notice{padding:10px 12px;border-radius:10px;background:#f9fafb;font-size:13px;margin-top:8px}.hidden{display:none}@media(max-width:700px){.wrap{padding:12px}header{align-items:flex-start;flex-direction:column}.summary{font-size:14px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div><h1>Weekly Lesson Scheduler</h1><p id="weekLabel" class="muted"></p></div>
  <div class="role-switch" aria-label="입력자 선택">
    <button class="role active" data-role="teacher">선생님</button>
    <button class="role" data-role="student">학생</button>
  </div>
</header>
<section class="legend card">
  <span><i class="dot p1dot"></i>1순위 — 가장 선호</span>
  <span><i class="dot p2dot"></i>2순위 — 가능</span>
  <span><i class="dot matchdot"></i>90분 공통 가능</span>
  <span><i class="dot confirmeddot"></i>확정 수업</span>
</section>
<section class="summary card">
  <div><strong>이번 주 확정</strong> <span id="confirmedCount">0 / 4</span></div>
  <div id="matchesText" class="muted">공통 가능 시간을 계산 중...</div>
</section>
<section class="schedule-card card"><div class="table-wrap"><table><thead><tr id="dateHeader"><th>시간</th></tr></thead><tbody id="scheduleBody"></tbody></table></div></section>
<section class="card"><h2>90분 공통 가능 후보</h2><div id="matchList" class="match-list"></div><p class="muted small">후보를 눌러 수업을 확정하거나 다시 눌러 해제할 수 있어요.</p></section>
<section class="card"><h2>저장 상태</h2><p id="syncStatus" class="sync-local">이 브라우저에 저장 중</p><div id="setupNotice" class="notice">Firebase 연결값이 없어서 현재는 이 기기에서만 저장됩니다. 연결값을 코드 상단에 넣으면 선생님과 학생이 같은 링크에서 실시간 공유합니다.</div></section>
</main>
<script type="module">
/* =========================================================
   FIREBASE WEB APP CONFIG
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD5-IDZ4thVx12aiJTL86nfNKW562jDwFs",
  authDomain: "lesson-scheduler-3ade0.firebaseapp.com",
  projectId: "lesson-scheduler-3ade0",
  storageBucket: "lesson-scheduler-3ade0.firebasestorage.app",
  messagingSenderId: "660645979147",
  appId: "1:660645979147:web:95cc12a75648e93c76d30e"
};

const START_MIN=6*60, END_MIN=26*60, SLOT=30, LESSON_SLOTS=3, TARGET_LESSONS=4;
let role='teacher';
let weeks=[];
let firestore=null, setDocFn=null;

const monday=getMonday(new Date());
const weekMondays=[monday, addDays(monday,7)];
const days=Array.from({length:14},(_,i)=>addDays(monday,i));

const weekLabel=document.getElementById('weekLabel'), dateHeader=document.getElementById('dateHeader'), body=document.getElementById('scheduleBody'), matchList=document.getElementById('matchList'), confirmedCount=document.getElementById('confirmedCount'), matchesText=document.getElementById('matchesText'), syncStatus=document.getElementById('syncStatus'), setupNotice=document.getElementById('setupNotice');

weekLabel.textContent=`${fmtDate(days[0])} – ${fmtDate(days[13])} · 이번 주 + 다음 주`; 
renderHeader(); renderGrid(); setupRoleButtons(); await initStorage(); renderAll();

function getMonday(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function pad(n){return String(n).padStart(2,'0')}
function weekId(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmtDate(d){return `${d.getMonth()+1}/${d.getDate()}`}
function dayLabel(d){return ['일','월','화','수','목','금','토'][d.getDay()]}
function timeText(minutes){const m=minutes%(24*60);return `${pad(Math.floor(m/60))}:${pad(m%60)}`}
function slotKey(localDayIndex,minutes){return `${localDayIndex}-${minutes}`}
function weekIndexFromGlobalDay(globalDay){return globalDay<7?0:1}
function localDayFromGlobalDay(globalDay){return globalDay%7}
function getWeekData(globalDay){return weeks[weekIndexFromGlobalDay(globalDay)]}
function getWeekStart(globalDay){return weekMondays[weekIndexFromGlobalDay(globalDay)]}
function globalConfirmedId(globalDay,min){return `${weekIndexFromGlobalDay(globalDay)}-${localDayFromGlobalDay(globalDay)}-${min}`}

function emptyWeek(m){return {key:weekId(m),ref:null,data:{teacher:{},student:{},confirmed:{}}}}
function ensureShape(w){w.data.teacher||={};w.data.student||={};w.data.confirmed||={}}

function renderHeader(){
  for(let i=0;i<14;i++){
    const th=document.createElement('th');
    const weekTag=i<7?'이번 주':'다음 주';
    th.innerHTML=`<span class="muted small">${weekTag}</span><br>${dayLabel(days[i])}<br><span class="muted">${fmtDate(days[i])}</span>`;
    if(i===7) th.style.borderLeft='3px solid #cbd5e1';
    dateHeader.appendChild(th)
  }
}
function renderGrid(){
  for(let min=START_MIN;min<=END_MIN;min+=SLOT){
    const tr=document.createElement('tr');
    const time=document.createElement('td');time.textContent=timeText(min);tr.appendChild(time);
    for(let d=0;d<14;d++){
      const td=document.createElement('td');td.className='slot';
      td.dataset.day=d;td.dataset.min=min;
      if(d===7) td.style.borderLeft='3px solid #cbd5e1';
      td.addEventListener('click',()=>cycleSlot(Number(td.dataset.day),Number(td.dataset.min)));
      tr.appendChild(td)
    }
    body.appendChild(tr)
  }
}
function setupRoleButtons(){document.querySelectorAll('.role').forEach(btn=>btn.addEventListener('click',()=>{role=btn.dataset.role;document.querySelectorAll('.role').forEach(b=>b.classList.toggle('active',b===btn));renderAll()}))}

function cycleSlot(globalDay,min){
  const wi=weekIndexFromGlobalDay(globalDay), ld=localDayFromGlobalDay(globalDay), w=weeks[wi], key=slotKey(ld,min);
  const current=w.data[role][key]||0,next=current===0?1:current===1?2:0;
  if(next===0)delete w.data[role][key];else w.data[role][key]=next;
  saveRole(wi); renderAll()
}

function renderAll(){
  weeks.forEach(ensureShape);
  const matches=findMatches();
  document.querySelectorAll('.slot').forEach(td=>{
    const globalDay=Number(td.dataset.day), min=Number(td.dataset.min), wi=weekIndexFromGlobalDay(globalDay), ld=localDayFromGlobalDay(globalDay), w=weeks[wi], key=slotKey(ld,min);
    td.className='slot'; if(globalDay===7) td.style.borderLeft='3px solid #cbd5e1';
    const mine=w.data[role][key]||0,other=w.data[role==='teacher'?'student':'teacher'][key]||0;
    if(mine===1)td.classList.add('p1');if(mine===2)td.classList.add('p2');if(other===1)td.classList.add('other-p1');if(other===2)td.classList.add('other-p2');
    if(matches.some(m=>m.globalKeys.includes(`${globalDay}-${min}`)))td.classList.add('match90');
    if(isConfirmedSlot(globalDay,min))td.classList.add('confirmed');
    td.title=`내 선택: ${mine||'없음'} / 상대: ${other||'없음'}`
  });
  renderMatches(matches);
  const thisCount=Object.keys(weeks[0].data.confirmed).length, nextCount=Object.keys(weeks[1].data.confirmed).length;
  confirmedCount.textContent=`이번 주 ${thisCount} / ${TARGET_LESSONS} · 다음 주 ${nextCount} / ${TARGET_LESSONS}`;
  matchesText.textContent=matches.length?`2주간 90분 공통 가능 후보 ${matches.length}개`:'아직 90분 연속 공통 가능 시간이 없습니다.'
}

function isConfirmedSlot(globalDay,min){
  const wi=weekIndexFromGlobalDay(globalDay), ld=localDayFromGlobalDay(globalDay), key=slotKey(ld,min);
  return Object.values(weeks[wi].data.confirmed).some(c=>c.keys.includes(key));
}

function findMatches(){
  const out=[];
  for(let globalDay=0;globalDay<14;globalDay++){
    const wi=weekIndexFromGlobalDay(globalDay), ld=localDayFromGlobalDay(globalDay), w=weeks[wi];
    for(let min=START_MIN;min<=END_MIN-(LESSON_SLOTS-1)*SLOT;min+=SLOT){
      const keys=Array.from({length:LESSON_SLOTS},(_,i)=>slotKey(ld,min+i*SLOT));
      if(keys.every(k=>(w.data.teacher[k]||0)>0&&(w.data.student[k]||0)>0)){
        const score=keys.reduce((s,k)=>s+(w.data.teacher[k]===1?2:1)+(w.data.student[k]===1?2:1),0);
        out.push({id:`${ld}-${min}`,wi,globalDay,ld,min,keys,globalKeys:Array.from({length:LESSON_SLOTS},(_,i)=>`${globalDay}-${min+i*SLOT}`),score})
      }
    }
  }
  return out.sort((a,b)=>a.globalDay-b.globalDay||a.min-b.min||b.score-a.score)
}

function renderMatches(matches){
  matchList.innerHTML='';
  if(!matches.length){matchList.innerHTML='<span class="muted">둘 다 가능한 90분 구간이 생기면 여기에 표시됩니다.</span>';return}
  matches.slice(0,60).forEach(m=>{
    const btn=document.createElement('button');btn.className='match-btn';
    const w=weeks[m.wi], isConfirmed=!!w.data.confirmed[m.id]; if(isConfirmed)btn.classList.add('confirmed');
    const weekTag=m.wi===0?'이번 주':'다음 주';
    btn.textContent=`${weekTag} · ${dayLabel(days[m.globalDay])} ${fmtDate(days[m.globalDay])} · ${timeText(m.min)}–${timeText(m.min+90)}${isConfirmed?' ✓':''}`;
    btn.addEventListener('click',()=>toggleConfirm(m));matchList.appendChild(btn)
  })
}

function toggleConfirm(m){
  const w=weeks[m.wi];
  if(w.data.confirmed[m.id]) delete w.data.confirmed[m.id];
  else {
    if(Object.keys(w.data.confirmed).length>=TARGET_LESSONS){alert(`${m.wi===0?'이번 주':'다음 주'} 수업 4회가 이미 확정되어 있어요. 하나를 해제한 뒤 선택해주세요.`);return}
    w.data.confirmed[m.id]={keys:m.keys,d:m.ld,min:m.min}
  }
  saveConfirmed(m.wi);renderAll()
}

async function initStorage(){
  weeks=weekMondays.map(emptyWeek);
  if(!firebaseConfig||!firebaseConfig.projectId){weeks.forEach((_,i)=>loadLocal(i));return}
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const {getFirestore,doc,onSnapshot,setDoc}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    const app=initializeApp(firebaseConfig);firestore=getFirestore(app);setDocFn=setDoc;
    weeks.forEach((w,i)=>{
      w.ref=doc(firestore,'schedules',w.key);
      onSnapshot(w.ref,snap=>{w.data=snap.exists()?snap.data():{teacher:{},student:{},confirmed:{}};ensureShape(w);renderAll()},err=>{console.error(err);syncStatus.textContent='Firebase 연결 오류 — 로컬 저장으로 전환됨';syncStatus.className='sync-error';loadLocal(i)})
    });
    syncStatus.textContent='Firebase 실시간 공동 저장 연결됨 · 2주 표시';syncStatus.className='sync-ok';setupNotice.classList.add('hidden')
  }catch(e){console.error(e);syncStatus.textContent='Firebase 연결 실패 — 로컬 저장 모드';syncStatus.className='sync-error';weeks.forEach((_,i)=>loadLocal(i))}
}
function loadLocal(i){const w=weeks[i],saved=localStorage.getItem(`lesson-${w.key}`);if(saved){try{w.data=JSON.parse(saved)}catch{}}ensureShape(w);syncStatus.textContent='로컬 저장 모드 — 이 기기에서만 저장';syncStatus.className='sync-local';renderAll()}
function saveLocal(i){const w=weeks[i];localStorage.setItem(`lesson-${w.key}`,JSON.stringify(w.data))}
async function saveRole(i){const w=weeks[i];if(w.ref&&setDocFn){try{await setDocFn(w.ref,{[role]:w.data[role]},{merge:true})}catch(e){console.error(e);saveLocal(i)}}else saveLocal(i)}
async function saveConfirmed(i){const w=weeks[i];if(w.ref&&setDocFn){try{await setDocFn(w.ref,{confirmed:w.data.confirmed},{merge:true})}catch(e){console.error(e);saveLocal(i)}}else saveLocal(i)}
</script>
</body>
</html>
