<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Lesson Scheduler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Weekly Lesson Scheduler</h1>
        <p id="weekLabel" class="muted"></p>
      </div>
      <div class="role-switch" aria-label="입력자 선택">
        <button class="role active" data-role="teacher">선생님</button>
        <button class="role" data-role="student">학생</button>
      </div>
    </header>

    <section class="legend card">
      <span><i class="dot p1"></i>1순위 — 가장 선호</span>
      <span><i class="dot p2"></i>2순위 — 가능</span>
      <span><i class="dot match"></i>90분 공통 가능</span>
      <span><i class="dot confirmed"></i>확정 수업</span>
    </section>

    <section class="summary card">
      <div><strong>이번 주 확정</strong> <span id="confirmedCount">0 / 4</span></div>
      <div id="matchesText" class="muted">공통 가능 시간을 계산 중...</div>
    </section>

    <section class="schedule-card card">
      <div class="table-wrap">
        <table id="scheduleTable">
          <thead><tr id="dateHeader"><th>시간</th></tr></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>90분 공통 가능 후보</h2>
      <div id="matchList" class="match-list"></div>
      <p class="muted small">후보를 눌러 수업을 확정하거나, 다시 눌러 해제할 수 있어요.</p>
    </section>

    <section class="card sync-box">
      <h2>저장 상태</h2>
      <p id="syncStatus">이 브라우저에 저장 중</p>
      <p class="muted small">Firebase 설정을 넣으면 선생님과 학생이 같은 링크에서 실시간으로 공유할 수 있습니다.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
